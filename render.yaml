services:
  # Backend Service (Spring Boot Docker)
  - type: web
    name: cannery-backend
    env: docker
    region: frankfurt
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: none
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: SPRING_JPA_OPEN_IN_VIEW
        value: "false"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "true"
      - key: SPRING_DATA_JPA_REPOSITORIES_BOOTSTRAP_MODE
        value: lazy
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
        value: "1"
      - key: SPRING_SQL_INIT_MODE
        value: always

    # Frontend Service (Vite Static Site)  
  - type: web
    name: cannery-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://cannery-backend-vlih.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html




