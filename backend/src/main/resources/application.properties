spring.application.name=cannery-warehouse
server.port=${PORT:8080}
spring.main.lazy-initialization=${SPRING_MAIN_LAZY_INITIALIZATION:false}
spring.data.jpa.repositories.bootstrap-mode=${SPRING_DATA_JPA_REPOSITORIES_BOOTSTRAP_MODE:default}

# Database Configuration (Neon.tech - LIVE)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-wispy-shape-aljddtmm-pooler.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_OX8uhyCGUnE4}
