spring.application.name=cannery-warehouse
server.port=${PORT:8080}
spring.main.lazy-initialization=${SPRING_MAIN_LAZY_INITIALIZATION:false}
spring.data.jpa.repositories.bootstrap-mode=${SPRING_DATA_JPA_REPOSITORIES_BOOTSTRAP_MODE:default}

# Database Configuration (Local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cannery_warehouse?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Configuration (Neon.tech - LIVE - Commented out)
# spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-wispy-shape-aljddtmm-pooler.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_OX8uhyCGUnE4}
# spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
spring.datasource.hikari.initialization-fail-timeout=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:1}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Render's persistent disk path if used, or local
upload.path=${UPLOAD_PATH:uploads}
